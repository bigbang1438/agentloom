name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run offline evaluation
        run: python -m agentloom.eval.harness --top-k 3

      - name: Run tests (251)
        run: pytest tests/ -q

      - name: Start service and smoke test
        run: |
          python -m uvicorn agentloom.api.app:app --host 127.0.0.1 --port 8791 &
          sleep 8
          python tools/smoke.py http://127.0.0.1:8791
